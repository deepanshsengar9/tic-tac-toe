<!DOCTYPE html>
<html>

<head>
    <title>Player-1 vs Player-2 - Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <h2>Player-1 vs Player-2</h2>

    <h3 id="message">Player-1's Turn (X)</h3>

    <div id="game">

        <button id="box1" onclick="play(box1)"></button>
        <button id="box2" onclick="play(box2)"></button>
        <button id="box3" onclick="play(box3)"></button>

        <button id="box4" onclick="play(box4)"></button>
        <button id="box5" onclick="play(box5)"></button>
        <button id="box6" onclick="play(box6)"></button>

        <button id="box7" onclick="play(box7)"></button>
        <button id="box8" onclick="play(box8)"></button>
        <button id="box9" onclick="play(box9)"></button>

    </div>

    <button id="reset" onclick="resetGame()">Reset Game</button>

    <script src="script.js"></script>

</body>

</html>
